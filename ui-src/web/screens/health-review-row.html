<!--
Added 2026-09-11 in https://github.com/nkyo/csf - see CHANGES.md.

One row of health-review.html's "about to delete" table (Task 7) - a
finding confirmed present AND fixable in the fresh reconcile() the review
step just ran. Its apply-name/id pair carries this finding's id forward to
POST /ui/health/apply as a hidden field, uniquely named for the same reason
health-row-fixable.html's checkboxes are (see health.html's header
comment) - nested inside the last <td> rather than as a bare child of
<table>, which HTML5's table content model does not permit.
-->
<tr>
	<td data-label="Kind"><span class="badge badge-danger">{{kind}}</span></td>
	<td data-label="Chain">{{chain}}</td>
	<td data-label="Family">IPv{{family}}</td>
	<td data-label="Address">{{ip}}</td>
	<td data-label="Rule"><code>{{spec}}</code><input type="hidden" name="{{apply_name}}" value="{{id}}"></td>
</tr>

<!--
Added 2026-09-11 in https://github.com/nkyo/csf - see CHANGES.md.

One row of a which=allow Lists page, admin variant (Task 7) - see
lists-row-deny.html's header comment; identical shape, against
POST /ui/lists/unallow (docs/WEBUI-RPC.md S5.6) instead of undeny.
-->
<tr>
	<td data-label="IP">{{ip}}</td>
	<td data-label="Note">{{note}} <span class="badge {{protected_class}}">{{protected_text}}</span></td>
	<td data-label="Actions">
		<form method="POST" action="/ui/lists/unallow" class="row-actions">
			<input type="hidden" name="_csrf" value="{{csrf}}">
			<input type="hidden" name="ip" value="{{ip}}">
			<input type="hidden" name="which" value="{{which}}">
			<input type="hidden" name="filter" value="{{filter}}">
			<input type="hidden" name="offset" value="{{offset}}">
			<button type="submit" class="btn btn-small">Unallow</button>
		</form>
	</td>
</tr>

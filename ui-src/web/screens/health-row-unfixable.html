<!--
Added 2026-09-11 in https://github.com/nkyo/csf - see CHANGES.md.

A reconcile finding with fixable:false (Task 7) - a GHOST (docs/WEBUI-RPC.md
S5.11: "the remedy is `restart`") or an unparsable entry. No checkbox at
all - not merely an unchecked one - so it can never be submitted as a
fix_id_N field regardless of what a hostile client might try to add
client-side; ui-src/bin/csf-ui's own POST handlers re-validate against a
FRESH reconcile()/fixable check regardless (docs/WEBUI-RPC.md S5.12), so
this is belt-and-braces, not the actual enforcement.
-->
<tr>
	<td data-label="Kind"><span class="badge badge-danger">{{kind}}</span></td>
	<td data-label="Chain">{{chain}}</td>
	<td data-label="Family">IPv{{family}}</td>
	<td data-label="Address">{{ip}}</td>
	<td data-label="Rule"><code>{{spec}}</code></td>
	<td data-label="Fix"><span class="findings-fixable">Not fixable: {{reason}}</span></td>
</tr>

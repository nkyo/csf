<!--
Added 2026-09-11 in https://github.com/nkyo/csf - see CHANGES.md.

R51's worked example: a GET <form> carrying pagination state as hidden
name=/value= inputs, not a query string spliced into href=. See lists.html's
header comment for the rule this follows. Rendered by ui-src/bin/csf-ui only
when offset > 0 (there is nothing "previous" to page 1) and spliced,
already-rendered, into lists.html's own raw "pagination" slot alongside
lists-pagination-next.html.
-->
<form method="GET" action="/ui/lists">
	<input type="hidden" name="which" value="{{which}}">
	<input type="hidden" name="filter" value="{{filter}}">
	<input type="hidden" name="offset" value="{{offset}}">
	<button type="submit" class="btn btn-small">Previous</button>
</form>

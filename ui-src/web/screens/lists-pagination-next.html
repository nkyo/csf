<!--
Added 2026-09-11 in https://github.com/nkyo/csf - see CHANGES.md.

R51's worked example, the "Next" half - see lists-pagination-prev.html.
Rendered only when docs/WEBUI-RPC.md S5.9's `next_offset` is defined
(non-null); this file's own offset value is ALWAYS that next_offset, never
offset + limit (S3.4/S5.9: the response may return fewer rows than limit,
so the two can differ).
-->
<form method="GET" action="/ui/lists">
	<input type="hidden" name="which" value="{{which}}">
	<input type="hidden" name="filter" value="{{filter}}">
	<input type="hidden" name="offset" value="{{offset}}">
	<button type="submit" class="btn btn-small">Next</button>
</form>
